name: Reto 2 — SSOT Contacts CI

on:
  push:
    paths:
      - "Reto2/Solucion/**"
      - ".github/workflows/reto2-ci.yml"
  pull_request:
    paths:
      - "Reto2/Solucion/**"
      - ".github/workflows/reto2-ci.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: Reto2/Solucion

concurrency:
  group: reto2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Dependency rules · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Build (tsc, emite dist/ que consumen los paquetes dependientes)
        run: pnpm run build

      - name: Typecheck (tsc, resuelve paquetes del workspace via dist/)
        run: pnpm run typecheck

      - name: Dependency rule (dependency-cruiser — no-llm-in-domain, anillos)
        run: pnpm run dep-cruise

      - name: Tests (Vitest)
        run: pnpm run test

  integration:
    name: Integración (RLS, Outbox, cripto) contra Postgres real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ssot_admin
          POSTGRES_PASSWORD: ssot_local_dev
          POSTGRES_DB: ssot_contacts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssot_admin -d ssot_contacts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (packages/* deben resolverse via dist/)
        run: pnpm run build

      - name: Bootstrap de roles (app_rw, app_relay — ADR-04, RT-13)
        env:
          PGPASSWORD: ssot_local_dev
        run: |
          psql -h localhost -U ssot_admin -d ssot_contacts -v ON_ERROR_STOP=1 -f infra/roles/001_create_app_rw.sql
          psql -h localhost -U ssot_admin -d ssot_contacts -v ON_ERROR_STOP=1 -f infra/roles/002_create_app_relay.sql

      - name: Migraciones (Drizzle — 16 tablas, RLS, extensiones, disparador de Outbox)
        working-directory: packages/infrastructure
        env:
          DATABASE_ADMIN_URL: postgresql://ssot_admin:ssot_local_dev@localhost:5432/ssot_contacts
        run: npx drizzle-kit migrate

      - name: Pruebas de integración (RLS FORCE+WITH CHECK, RT-04 atomicidad, relé del Outbox)
        working-directory: packages/infrastructure
        env:
          TEST_DATABASE_URL: postgresql://app_rw:app_rw_local_dev_change_me@localhost:5432/ssot_contacts
          TEST_RELAY_DATABASE_URL: postgresql://app_relay:app_relay_local_dev_change_me@localhost:5432/ssot_contacts
        run: npx vitest run --config vitest.integration.config.ts

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: Reto2/Solucion/.gitleaks.toml

  sast-scan:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (reglas propias + registro de seguridad)
        working-directory: .
        run: |
          semgrep scan \
            --config Reto2/Solucion/.semgrep.yml \
            --config p/security-audit \
            --config p/typescript \
            --error \
            Reto2/Solucion
