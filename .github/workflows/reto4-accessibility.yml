name: Reto 4 — Motor Analitico Edge Accessibility Checks

on:
  push:
    branches: [main]
    paths:
      - "Reto4/Solucion/**"
      - ".github/workflows/reto4-accessibility.yml"
  pull_request:
    paths:
      - "Reto4/Solucion/**"
      - ".github/workflows/reto4-accessibility.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: Reto4/Solucion

concurrency:
  group: reto4-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: WCAG 2.1 AA checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m tests.accessibility.run_checks
