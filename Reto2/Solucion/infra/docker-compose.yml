name: ssot-contacts

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssot_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ssot_contacts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # postgres solo ejecuta scripts *.sh/*.sql colocados directamente en
      # /docker-entrypoint-initdb.d (no recorre subdirectorios), por eso el
      # contenido de infra/roles se monta en la raiz de initdb (RT-13, ADR-04).
      - ./roles:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssot_admin} -d ${POSTGRES_DB:-ssot_contacts}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
