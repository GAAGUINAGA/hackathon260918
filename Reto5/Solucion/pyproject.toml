[project]
name = "reto5-doc-organizer"
version = "0.1.0"
description = "Clasificación, organización y nombramiento automatizado de documentos (Reto 5)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.37",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "supabase>=2.5",
    "pytesseract>=0.3.10",
    "paddleocr>=2.8",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "spacy>=3.7",
    "dateparser>=1.2",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "ollama>=0.3",
    "watchdog>=4.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "vcrpy>=6.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "types-pyyaml",
    "types-dateparser",
]

[project.scripts]
reto5 = "reto5.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reto5"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-m 'not llm_local and not llm_remote' --strict-markers"
testpaths = ["tests"]
markers = [
    "llm_local: requiere Ollama local (opt-in)",
    "llm_remote: requiere cassette VCR",
    "supabase: requiere Supabase local",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/reto5"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
