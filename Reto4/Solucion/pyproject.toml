[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-analitico-edge"
version = "0.1.0"
description = "Motor analitico de video edge - Reto 4"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "src/ai/tracking"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["src/ai/tracking"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openvino.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ultralytics.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Codigo vendorizado/adaptado de terceros (AGPL-3.0, ver src/ai/tracking/NOTICE.md):
# se sigue para inferencia de tipos pero no se exige --strict sobre su contenido.
module = "src.ai.tracking.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
