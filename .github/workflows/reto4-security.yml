name: Reto 4 — Motor Analitico Edge Security Gates

on:
  push:
    branches: [main, RETO-4_VISION-ARTIFICIAL]
    paths:
      - "Reto4/Solucion/**"
      - ".github/workflows/reto4-security.yml"
  pull_request:
    paths:
      - "Reto4/Solucion/**"
      - ".github/workflows/reto4-security.yml"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: Reto4/Solucion

concurrency:
  group: reto4-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: bandit · pip-audit · safety · detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: bandit -r src/ -ll
      # PYSEC-2026-3740 (nltk, transitive dep of `safety`): sin fix upstream,
      # no aplica a este proyecto (no cargamos modelos NLTK). Ver SECURITY.md.
      - run: pip-audit --ignore-vuln PYSEC-2026-3740
      - run: safety check
      - run: detect-secrets scan --baseline .secrets.baseline
